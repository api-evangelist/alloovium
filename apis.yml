name: Alloovium
description: Alloovium is an AI-native document intelligence and compliance platform for the construction
  industry. It reads construction project documents (contracts, specifications, drawings, submittals, RFIs,
  and emails), answers questions with page-level citations, extracts and cross-references data, tracks
  obligations and deadlines, and drafts variations, RFIs, reports, and compliance evidence behind a human
  review gate. Alloovium exposes a public REST API v2 and a hosted Model Context Protocol (MCP) server so
  agents and integrations can query the vault, run chat, execute workflows, and fill templates. Founded by
  Zander Schweitzer and Cielo Nicolosi, Alloovium is a Y Combinator Summer 2026 company based in Brisbane,
  Australia.
